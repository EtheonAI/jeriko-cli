packages:
  - "apps/*"
  - "packages/*"

registries:
  default: https://registry.npmjs.org/

preferOffline: false
autoInstallPeers: true
strictPeerDependencies: true
dedupePeerDependents: true
engineStrict: true
nodeVersion: 22.22.1
minimumReleaseAge: 0
blockExoticSubdeps: true

publicHoistPattern:
  - better-auth
  - drizzle-orm
  - "@neondatabase/serverless"

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  core-js: false
  core-js-pure: false
  esbuild: true
  keytar: true
  msw: false
  protobufjs: true
  puppeteer: false
  sharp: true

overrides:
  react: "19.2.6"
  react-dom: "19.2.6"

packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "*"

# These are audited upstream-only transitive deprecations. Keep exact and revisit
# when the owning packages publish dependency-tree cleanup releases.
allowedDeprecatedVersions:
  "@esbuild-kit/core-utils": "3.3.2"
  "@esbuild-kit/esm-loader": "2.6.5"
  glob: "7.1.6 || 7.2.3"
  inflight: "1.0.6"
  prebuild-install: "7.1.3"
  puppeteer: "22.14.0"
  rimraf: "2.7.1 || 3.0.2"
  uuid: "8.3.2 || 10.0.0"

peerDependencyRules:
  allowedVersions:
    "@mdx-js/react>react": "19.2.6"
    "@mintlify/mdx>react": "19.2.6"
    "@mintlify/mdx>react-dom": "19.2.6"
    "ink>react": "19.2.6"
    "ink-spinner>react": "19.2.6"
    "next-mdx-remote-client>react": "19.2.6"
    "next-mdx-remote-client>react-dom": "19.2.6"
