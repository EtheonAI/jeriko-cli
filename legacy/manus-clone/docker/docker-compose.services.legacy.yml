services:
  # ===========================================
  # Infrastructure Services
  # ===========================================

  postgres:
    image: postgres:17-alpine
    container_name: jeriko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jeriko
      POSTGRES_PASSWORD: jeriko_dev_password
      POSTGRES_DB: jeriko
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeriko"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jeriko-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Inngest (Workflow Orchestration)
  # ===========================================

  inngest:
    image: inngest/inngest:latest
    container_name: jeriko-inngest
    restart: unless-stopped
    ports:
      - "8288:8288"
    environment:
      INNGEST_EVENT_KEY: local-dev-event-key
      INNGEST_SIGNING_KEY: signkey-test-12345678
    command: inngest dev -u http://task:3002/inngest --no-discovery

  # ===========================================
  # Node.js Services
  # ===========================================

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: jeriko-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://jeriko:jeriko_dev_password@postgres:5432/jeriko
      JWT_SECRET: dev-jwt-secret-change-in-production
      TASK_SERVICE_URL: http://task:3002
      ORCHESTRATOR_SERVICE_URL: http://orchestrator:4014
      DEVICE_SERVICE_URL: http://device:4001
      FILE_SERVICE_URL: http://file:3003
      WEBSITE_SERVICE_URL: http://website:3004
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/gateway:/app/services/gateway
      - ./packages:/app/packages
      - /app/node_modules
      - /app/services/gateway/node_modules

  task:
    build:
      context: .
      dockerfile: services/task/Dockerfile
    container_name: jeriko-task
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://jeriko:jeriko_dev_password@postgres:5432/jeriko
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-local-dev-event-key}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-signkey-test-12345678}
      INNGEST_BASE_URL: http://inngest:8288
      ORCHESTRATOR_SERVICE_URL: http://orchestrator:4014
      DEVICE_SERVICE_URL: http://device:4001
      GATEWAY_SECRET: ${GATEWAY_SECRET:-}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inngest:
        condition: service_started
    volumes:
      - ./services/task:/app/services/task
      - ./packages:/app/packages
      - /app/node_modules
      - /app/services/task/node_modules

  file:
    build:
      context: .
      dockerfile: services/file/Dockerfile
    container_name: jeriko-file
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3003
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://jeriko:jeriko_dev_password@postgres:5432/jeriko
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-jeriko-files-dev}
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  website:
    build:
      context: .
      dockerfile: services/website/Dockerfile
    container_name: jeriko-website
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3004
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://jeriko:jeriko_dev_password@postgres:5432/jeriko
      TIDB_PUBLIC_KEY: ${TIDB_PUBLIC_KEY:-}
      TIDB_PRIVATE_KEY: ${TIDB_PRIVATE_KEY:-}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    container_name: jeriko-billing
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3005
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://jeriko:jeriko_dev_password@postgres:5432/jeriko
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: jeriko-notification
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3006
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://jeriko:jeriko_dev_password@postgres:5432/jeriko
      KNOCK_API_KEY: ${KNOCK_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  webhook:
    build:
      context: .
      dockerfile: services/webhook/Dockerfile
    container_name: jeriko-webhook
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3007
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://jeriko:jeriko_dev_password@postgres:5432/jeriko
      SVIX_API_KEY: ${SVIX_API_KEY:-}
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  connector:
    build:
      context: .
      dockerfile: services/connector/Dockerfile
    container_name: jeriko-connector
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3008
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://jeriko:jeriko_dev_password@postgres:5432/jeriko
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      COMPOSIO_BASE_URL: ${COMPOSIO_BASE_URL:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3008:3008"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  search:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    container_name: jeriko-search
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3009
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://jeriko:jeriko_dev_password@postgres:5432/jeriko
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    ports:
      - "3009:3009"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  project:
    build:
      context: .
      dockerfile: services/project/Dockerfile
    container_name: jeriko-project
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3010
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://jeriko:jeriko_dev_password@postgres:5432/jeriko
    ports:
      - "3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===========================================
  # Orchestrator Services
  # ===========================================

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: jeriko-orchestrator
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4014
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://jeriko:jeriko_dev_password@postgres:5432/jeriko
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      E2B_API_KEY: ${E2B_API_KEY:-}
      CONNECTOR_SERVICE_URL: http://connector:4009
      WEBRTC_MEDIA_SERVICE_URL: http://webrtc-media:4016
      SANDBOX_SERVICE_URL: http://sandbox:4012
    ports:
      - "4014:4014"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  webrtc-media:
    build:
      context: .
      dockerfile: services/webrtc-media/Dockerfile
    container_name: jeriko-webrtc-media
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4016
      NEKO_PUBLIC_HOST: localhost
      NEKO_PUBLIC_PORT: 8080
      NEKO_PUBLIC_SCHEME: https
      NOVNC_PUBLIC_HOST: localhost
      NOVNC_PUBLIC_PORT: 6080
    ports:
      - "4016:4016"

  # ===========================================
  # Python Services
  # ===========================================

  knowledge:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    container_name: jeriko-knowledge
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      PORT: 8001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://jeriko:jeriko_dev_password@postgres:5432/jeriko
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  device:
    build:
      context: .
      dockerfile: services/device/Dockerfile
    container_name: jeriko-device
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://jeriko:jeriko_dev_password@postgres:5432/jeriko
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/device:/app/services/device
      - ./packages:/app/packages
      - /app/node_modules
      - /app/services/device/node_modules

  # ===========================================
  # Go Services
  # ===========================================

  sandbox:
    build:
      context: .
      dockerfile: services/sandbox/Dockerfile
    container_name: jeriko-sandbox
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      PORT: 8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      E2B_API_KEY: ${E2B_API_KEY:-}
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: jeriko-network
