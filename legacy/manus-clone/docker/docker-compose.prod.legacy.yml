      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4014/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jeriko-network

  # Search Service
  search:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    restart: unless-stopped
