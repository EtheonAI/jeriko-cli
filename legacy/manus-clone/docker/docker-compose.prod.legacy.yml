      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jeriko-network

  # Sandbox Service
  sandbox:
    build:
      context: .
      dockerfile: services/sandbox/Dockerfile
    restart: unless-stopped
