      NODE_ENV: production
      PORT: 4013
      DATABASE_URL: postgresql://${POSTGRES_USER:-jeriko}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jeriko}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
