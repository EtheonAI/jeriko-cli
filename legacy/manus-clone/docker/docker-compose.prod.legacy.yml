      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jeriko-network

  # Knowledge Service
  knowledge:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
