<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rubic Desktop</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #1a1a2e; color: #fff;
    display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
</style>
</head>
<body>
<div id="status">Connecting...</div>
<script>
(async function() {
  var p = new URLSearchParams(window.location.search);
  var usr = p.get('usr') || 'Rubic';
  var pwd = p.get('pwd') || 'neko';
  // server = the Neko sandbox origin (e.g. https://<sandbox>.e2b.app)
  // When hosted on CDN, this is required. When self-hosted inside sandbox, defaults to same origin.
  var server = p.get('server') || '';

  // 1. Set localStorage for v2 client
  localStorage.setItem('displayname', usr);
  localStorage.setItem('password', pwd);
  localStorage.setItem('volume', '100');
  localStorage.setItem('mute', '0');
  // Persist server origin for index.html auth bridge
  if (server) sessionStorage.setItem('neko_server', server);

  // 2. Call v3 REST API — with cookies disabled, token is in the response body
  var loginUrl = (server || '') + '/api/login';
  try {
    var res = await fetch(loginUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: usr, password: pwd })
    });
    if (res.ok) {
      var data = await res.json();
      console.log('[Rubic] /api/login response:', JSON.stringify(data));
      if (data.token) {
        sessionStorage.setItem('neko_token', data.token);
      }
    }
  } catch(e) {
    console.warn('[Rubic] /api/login failed:', e);
  }

  // 3. Redirect to main client (pass server param for index.html)
  var redirect = server ? '/?server=' + encodeURIComponent(server) : '/';
  window.location.replace(redirect);
})();
</script>
</body>
</html>
