[program:mcp-server]
command=/opt/.rubic/.packages/scripts/start-rubic-mcp-server.sh
directory=/home/ubuntu
user=ubuntu
stdout_logfile=/var/log/supervisor/mcp-server.log
stderr_logfile=/var/log/supervisor/mcp-server.err.log
environment=
    HOME="/home/ubuntu",
    MCP_SERVER_PORT="8350",
    RUNTIME_API_HOST="http://127.0.0.1:9330"
startsecs=2
stopwaitsecs=5
stopsignal=TERM
autostart=false
autorestart=true
priority=4
