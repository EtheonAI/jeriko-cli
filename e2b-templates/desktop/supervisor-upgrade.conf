[program:upgrade-service]
command=python3 /opt/.rubic/runtime/upgrade/upgrade_service.py
directory=/home/ubuntu
user=ubuntu
stdout_logfile=/var/log/supervisor/upgrade-service.log
stderr_logfile=/var/log/supervisor/upgrade-service.err.log
environment=
    HOME="/home/ubuntu",
    UPGRADE_SERVICE_PORT="8340"
startsecs=2
stopwaitsecs=5
stopsignal=TERM
autostart=true
autorestart=true
priority=3
