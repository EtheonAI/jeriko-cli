[program:chrome]
command=/opt/.rubic/.packages/scripts/check-start-chrome.sh
directory=/home/ubuntu
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/chrome.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=DISPLAY=":0",HOME="/home/ubuntu"
priority=6
