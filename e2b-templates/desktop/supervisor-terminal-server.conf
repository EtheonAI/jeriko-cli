[program:sandbox-runtime]
command=python3 -m sandbox_runtime.start_server
directory=/opt/.rubic/runtime
user=ubuntu
stdout_logfile=/var/log/supervisor/sandbox-runtime.log
stderr_logfile=/var/log/supervisor/sandbox-runtime.err.log
environment=
    PYTHONPATH="/opt/.rubic/runtime",
    PATH="/home/ubuntu/bin:/home/ubuntu/.local/bin:/home/ubuntu/.local/share/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
    HOME="/home/ubuntu",
    DISPLAY=":0",
    PYTHONIOENCODING="utf-8",
    RUBIC_OPT_PATH="/opt/.rubic",
    RUNTIME_PATH="/opt/.rubic/runtime",
    CHROME_INSTANCE_PATH="/usr/bin/chromium-browser",
    WEBDEV_TEMPLATES_PATH="/opt/.rubic/webdev/templates",
    DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/dbus-session-bus-socket",
    TZ="UTC"
startsecs=3
stopwaitsecs=10
stopsignal=TERM
killasgroup=true
stopasgroup=true
exitcodes=0
priority=1
autostart=false
autorestart=true
